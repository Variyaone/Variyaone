<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Variya — Curiosity into something useful.</title>
  <desc id="desc">A personal lab for AI agents, skills and workflows. An idea becomes a skill, a workflow, and something useful.</desc>
  <defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e2e8da"/></pattern></defs>
  <rect width="1000" height="310" rx="16" fill="#f3f5ed"/>
  <rect x="602" y="20" width="376" height="270" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
