    <text x="39" y="136" fill="#202d25" font-size="80" font-weight="700" letter-spacing="-4">Variya<tspan fill="#48643a">.</tspan></text>
    <text x="43" y="183" fill="#202d25" font-size="24">Curiosity into something useful.</text>
